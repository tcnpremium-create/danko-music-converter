<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f9ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Tile de fondo con gradiente de marca -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Ecualizador / waveform -->
  <g fill="url(#wave)">
    <rect x="150" y="238" width="26" height="36" rx="13"/>
    <rect x="196" y="206" width="26" height="100" rx="13"/>
    <rect x="242" y="168" width="26" height="176" rx="13"/>
    <rect x="288" y="206" width="26" height="100" rx="13"/>
    <rect x="334" y="238" width="26" height="36" rx="13"/>
  </g>

  <!-- Letra D estilizada, semitransparente, integrada -->
  <path d="M170 130 h96 a126 126 0 0 1 0 252 h-96 a16 16 0 0 1 -16 -16 v-40 h40 v16 h72 a86 86 0 0 0 0 -172 h-72 v16 h-40 v-40 a16 16 0 0 1 16 -16 z"
        fill="#ffffff" fill-opacity="0.16"/>
</svg>
