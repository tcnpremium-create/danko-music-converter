name: "✨ Feature request"
description: Suggest an idea for Danko Music Converter
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do? What's missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or behavior you'd like.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Conversion, Library, Analyze, Queue, Player, Metadata, MCP/AI, UI, Other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
